# Include a set of BROWSER configuration
{% include "groups/browser.toml" %}

# Mount a separate HOME directory
{% set homedir = os_env("HOME") + "/.local/share/hakoniwa/apps/zen-browser" %}
{% set _ = fs_mkdir(homedir) %}
[[mounts]]
source = "{{ homedir }}"
destination = "{{ HOME }}"
rw = true

# COMMAND
[command]
cmdline = ["/usr/bin/zen"]
cwd = "{{ HOME }}"

# Embed user profile
{% include "local/zen-browser.toml" ignore missing %}
