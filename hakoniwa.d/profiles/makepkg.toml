# Constants
{% set _appname_ = "makepkg" %}

# Include a preset configuration
{% include "presets/devkit.toml" %}

# Mount /var/lib which stores application's data
{% set folder = "/var/lib/pacman" %}
{% if path_exists(folder) %}
[[mounts]]
source = "{{ folder }}"
{% endif %}

# Mount AUR folders
{% for entry in [
  os_env("HOME") + "/.cache/paru",
  os_env("HOME") + "/.cache/yay",
] %}
  {% if path_exists(entry) %}
[[mounts]]
source = "{{ entry }}"
rw = true
  {% endif %}
{% endfor %}

# Donot try chown in fakeroot environment
[[envs]]
name = "FAKEROOTDONTTRYCHOWN"
value = "1"

# Customized user profile
{% include ("local/" + _appname_ + ".toml") ignore missing %}
