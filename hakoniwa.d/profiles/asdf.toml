# Constants
{% set _appname_ = "asdf" %}

# Include a preset configuration
{% include "presets/devkit.toml" %}

# Mount ASDF_DATA_DIR
{% if printenv("ASDF_DATA_DIR") is eq "" %}
  {% set asdf_data_dir = printenv("HOME") + "/.asdf" %}
{% else %}
  {% set asdf_data_dir = printenv("ASDF_DATA_DIR")   %}
{% endif %}
{% set _ = mkdir_p(asdf_data_dir) %}
[[mounts]]
source = "{{ asdf_data_dir }}"
rw = true

# Mount ASDF_CONFIG_FILE
{% if printenv("ASDF_CONFIG_FILE") is eq "" %}
  {% set asdf_config_file = printenv("HOME") + "/.asdfrc" %}
{% else %}
  {% set asdf_config_file = printenv("ASDF_CONFIG_FILE")   %}
{% endif %}
{% set _ = touch(asdf_config_file) %}
[[mounts]]
source = "{{ asdf_config_file }}"
rw = true

# Mount .tool-versions
{% set tool_versions = printenv("HOME") + "/.tool-versions" %}
{% set _ = touch(tool_versions) %}
[[mounts]]
source = "{{ tool_versions }}"
rw = true

# List of environment variables exported to the application
{% for name in [
  "ASDF_DATA_DIR",
  "ASDF_CONFIG_FILE",
  "ASDF_CONCURRENCY",
] %}
  {% if printenv(name) is ne "" %}
[[envs]]
name = "{{ name }}"
  {% endif %}
{% endfor %}

# Customized user profile
{% include ("local/" + _appname_ + ".toml") ignore missing %}
