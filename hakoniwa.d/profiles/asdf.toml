# Constants
{% set _binname_ = "asdf" %}

# Include a preset configuration
{% include "presets/devkit.toml" %}

# Mount asdf folders
{% set _ = fs_mkdir(os_env("HOME") + "/.asdf")          %}
{% set _ = fs_touch(os_env("HOME") + "/.asdfrc")        %}
{% set _ = fs_touch(os_env("HOME") + "/.tool-versions") %}
{% for entry in [
  os_env("HOME") + "/.asdf",
  os_env("HOME") + "/.asdfrc",
  os_env("HOME") + "/.tool-versions",
] %}
  {% if path_exists(entry) %}
[[mounts]]
source = "{{ entry }}"
rw = true
  {% endif %}
{% endfor %}

# Customized user profile
{% include ("local/" + _binname_ + ".toml") ignore missing %}
