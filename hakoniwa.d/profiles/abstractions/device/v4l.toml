# Video for linux
{% set device = "/dev/v4l" %}
{% if path_exists(device) %}
[[mounts]]
source = "{{ device }}"
rw = true
{% endif %}

# Video capture devices
{% for device in find("/dev/video*") %}
[[mounts]]
source = "{{ device }}"
rw = true
{% endfor %}
