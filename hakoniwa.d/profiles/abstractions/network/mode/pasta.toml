# Create a user-mode networking stack using pasta
[network]
mode = "pasta"
options = ["-T", "auto", "-t", "auto", "-U", "auto", "-u", "auto"]

# Setting DNS servers
{% if path_is_symlink("/etc/resolv.conf") %}
{% set original = readlink("/etc/resolv.conf") %}
  {% if original is endingwith "/run/systemd/resolve/stub-resolv.conf" %}
[[mounts]]
source = "/run/systemd/resolve/resolv.conf"
destination = "/run/systemd/resolve/stub-resolv.conf"
  {% endif %}
{% endif %}
