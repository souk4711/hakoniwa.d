# AT-SPI-Bus socket
{% set address = printenv("AT_SPI_BUS_ADDRESS") %}
{% if address is eq "" %}
  {% set socket = printenv("XDG_RUNTIME_DIR") + "/at-spi" %}
  {% if path_exists(socket) %}
[[mounts]]
source = "{{ socket }}"
rw = true
  {% endif %}
{% elif address is startingwith "unix:path=" %}
  {% set socket = address | replace("unix:path=", "") %}
  {% if path_exists(socket) %}
[[mounts]]
source = "{{ socket }}"
rw = true
  {% endif %}
{% endif %}

# List of environment variables exported to the application
{% for name in [
  "AT_SPI_BUS_ADDRESS",
] %}
  {% if printenv(name) is ne "" %}
[[envs]]
name = "{{ name }}"
  {% endif %}
{% endfor %}
