# Constants
{% set _appname_ = "zen" %}

# Include a preset configuration
{% include "presets/desktop-web/browser.toml" %}

# Persist HOME subdirs
{% for (source, destination) in [
  ( _apphome_ + "/.mozilla", printenv("HOME") + "/.mozilla"),
  ( _apphome_ + "/.zen", printenv("HOME") + "/.zen"),
] %}
  {% set _ = mkdir_p(source) %}
[[mounts]]
source = "{{ source }}"
destination = "{{ destination }}"
rw = true
{% endfor %}

# Customized user profile
{% include ("local/" + _appname_ + ".toml") ignore missing %}
