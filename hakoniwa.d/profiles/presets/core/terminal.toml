# Include a set of built-in configuration
"@include" = [
  "abstractions/os/bare.toml",                    # OS - Bare
  {% block _include_ %}{% endblock %}             # Customized @include
]

# Persist XDG base directories
{% set _apphome_ = printenv("HOME") + "/.local/share/hakoniwa/apps/" + _appname_ + "/persist" %}
{% for (source, destination) in [
  ( _apphome_ + "/.cache" , printenv("HOME") + "/.cache" ),
  ( _apphome_ + "/.config", printenv("HOME") + "/.config"),
  ( _apphome_ + "/.local" , printenv("HOME") + "/.local" ),
] %}
  {% set _ = mkdir_p(source) %}
[[mounts]]
source = "{{ source }}"
destination = "{{ destination }}"
rw = true
{% endfor %}

# Customized main contents
{% block _main_ %}{% endblock %}

# COMMAND
[command]
cmdline = ["{{ "/usr/bin/" + _appname_ }}"]
cwd = "{{ printenv("PWD") }}"
