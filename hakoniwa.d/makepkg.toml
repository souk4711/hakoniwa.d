# Constants
{% set _pkgname_ = "makepkg" %}
{% set _binname_ = "makepkg" %}

# Include a set of DEVKIT configuration
{% include "groups/devkit.toml" %}

# Mount /var/lib which stores application's data
[[mounts]]
source = "/var/lib/pacman"

# Mount AUR folders
{% for entry in [
  os_env("HOME") + "/.cache/paru",
  os_env("HOME") + "/.cache/yay",
] %}
  {% if path_exists(entry) %}
[[mounts]]
source = "{{ entry }}"
rw = true
  {% endif %}
{% endfor %}

# Donot try chown in fakeroot environment
[[envs]]
name = "FAKEROOTDONTTRYCHOWN"
value = "1"

# Customized user profile
{% include ("local/" + _pkgname_ + ".toml") ignore missing %}
