# Include a set of built-in configuration
"@include" = [
  "abstractions/os/linux.toml",

  "abstractions/network/mode/pasta.toml",
  "abstractions/network/connect/autoproxy.toml",
  "abstractions/network/connect/http.toml",
  "abstractions/network/connect/https.toml",
]

# Mount /var/lib which stores application's data
[[mounts]]
source = "/var/lib/pacman"

# Mount $PWD
[[mounts]]
source = "{{ PWD }}"
destination = "/tmp/makepkg"
rw = true

# Allow READ-WRITE-EXEC on $PWD
[[landlock.fs]]
path = "/tmp/makepkg"
access = "rwx"

# Mount a separate HOME directory
{% set homedir = os_env("HOME") + "/.local/share/hakoniwa/apps/makepkg" %}
{% set _ = fs_mkdir(homedir) %}
[[mounts]]
source = "{{ homedir }}"
destination = "{{ HOME }}"
rw = true

# COMMAND
[command]
cmdline = ["/bin/makepkg"]
cwd = "/tmp/makepkg"

# Embed user profile
{% include "local/makepkg.toml" ignore missing %}
