# Use preset TERMINAL-NETWORK as base skeleton
{% extends "presets/core/terminal-network.toml" %}

# Customized @include
{% block _include_ %}
  "abstractions/filesystem/xdg-code.toml",        # Share Folder - $HOME/Code
{% endblock %}

# Customized main contents
{% block _main_ %}
# Donot impose FS restrictions on /home
[[landlock.fs]]
path = "/home"
access = "rwx"

# Donot impose FS restrictions on /tmp
[[landlock.fs]]
path = "/tmp"
access = "rwx"
{% endblock %}
