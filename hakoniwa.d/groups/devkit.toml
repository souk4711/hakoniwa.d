# Include a set of built-in configuration
"@include" = [
  "abstractions/os/linux.toml",                   # Base
  "abstractions/network/mode/host.toml",          # Network Mode - Host
  "abstractions/network/connect/autoproxy.toml",  # Allow outgoing $ALL_PROXY/... connections
  "abstractions/network/connect/http.toml",       # Allow outgoing HTTP connections
  "abstractions/network/connect/https.toml",      # Allow outgoing HTTPS connections
  "abstractions/filesystem/xdg-code.toml",        # Share Folder - $HOME/Code
]

# Donot impose FS restrictions
[[landlock.resources]]
type = "fs"
unrestrict = true
