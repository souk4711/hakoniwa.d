# Include a set of DEVKIT configuration
{% include "groups/devkit.toml" %}

# Mount mise folders
{% set _ = fs_mkdir(os_env("HOME") + "/.cache/mise") %}
{% set _ = fs_mkdir(os_env("HOME") + "/.config/mise") %}
{% set _ = fs_mkdir(os_env("HOME") + "/.local/share/mise") %}
{% set _ = fs_mkdir(os_env("HOME") + "/.local/state/mise") %}
{% set _ = fs_touch(os_env("HOME") + "/.tool-versions") %}
{% for entry in [
  os_env("HOME") + "/.cache/mise",
  os_env("HOME") + "/.config/mise",
  os_env("HOME") + "/.local/share/mise",
  os_env("HOME") + "/.local/state/mise",
  os_env("HOME") + "/.tool-versions",
] %}
  {% if path_exists(entry) %}
[[mounts]]
source = "{{ entry }}"
rw = true
  {% endif %}
{% endfor %}

# Mount a separate HOME directory
{% set homedir = os_env("HOME") + "/.local/share/hakoniwa/apps/mise" %}
{% set _ = fs_mkdir(homedir) %}
[[mounts]]
source = "{{ homedir }}"
destination = "{{ HOME }}"
rw = true

# COMMAND
[command]
cmdline = ["/usr/bin/mise"]
cwd = "{{ PWD }}"

# Embed user profile
{% include "local/mise.toml" ignore missing %}
