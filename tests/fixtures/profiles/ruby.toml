# Include a set of built-in configuration
"@include" = [
  "../../../hakoniwa.d/profiles/abstractions/os/linux.toml",                   # Base
  "../../../hakoniwa.d/profiles/abstractions/network/mode/host.toml",          # Network Mode - Host
  "../../../hakoniwa.d/profiles/abstractions/network/connect/autoproxy.toml",  # Allow outgoing $ALL_PROXY/... connections
  "../../../hakoniwa.d/profiles/abstractions/network/connect/http.toml",       # Allow outgoing HTTP connections
  "../../../hakoniwa.d/profiles/abstractions/network/connect/https.toml",      # Allow outgoing HTTPS connections
  "../../../hakoniwa.d/profiles/abstractions/filesystem/xdg-code.toml",        # Share Folder - $HOME/Code
]

# Mount a separate HOME directory
{% set homedir = os_env("HOME") + "/.local/share/hakoniwa/apps/ruby" %}
{% set _ = fs_mkdir(homedir) %}
[[mounts]]
source = "{{ homedir }}"
destination = "{{ os_env("HOME") }}"
rw = true

# COMMAND
[command]
cmdline = ["/usr/bin/ruby"]
cwd = "{{ os_env("HOME") }}"

# Embed user profile
{% include "local/ruby.toml" ignore missing %}
